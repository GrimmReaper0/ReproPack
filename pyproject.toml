[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repropack"
version = "0.1.0"
description = "Capture inspectable bug reports with selected inputs, checksums and execution evidence. Verify and replay trusted reproductions locally."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GrimmReaper0"}]
keywords = ["debugging", "reproducibility", "bug-reports", "record-replay", "developer-tools", "cli", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
]
dependencies = []

[project.scripts]
repropack = "repropack.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/GrimmReaper0/ReproPack"
Repository = "https://github.com/GrimmReaper0/ReproPack"
Issues = "https://github.com/GrimmReaper0/ReproPack/issues"
Documentation = "https://github.com/GrimmReaper0/ReproPack/blob/main/docs/guide.md"

[tool.setuptools.packages.find]
include = ["repropack*"]
exclude = ["tests*"]
